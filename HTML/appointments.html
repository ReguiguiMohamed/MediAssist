    <script>
        // Update current year in footer
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Show/Hide Appointment Form
        document.getElementById('add-appt-btn').addEventListener('click', () => {
            document.getElementById('appt-form-container').style.display = 'block';
        });

        document.getElementById('cancel-appt-btn').addEventListener('click', () => {
            document.getElementById('appt-form-container').style.display = 'none';
        });

        // Appointment Form Submission
        document.getElementById('appointment-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const msgDiv = document.getElementById('appt-success-msg');
            const errorDiv = document.getElementById('appt-form-error');

            // Reset message displays
            msgDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            // Client-side validation for past dates
            const appointmentDate = new Date(formData.get('appointment_date') + 'T' + formData.get('appointment_time'));
            const now = new Date();

            if (appointmentDate < now) {
                errorDiv.textContent = "Cannot schedule appointments in the past. Please select a future date and time.";
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data && data.success !== false && !data.error) {
                    msgDiv.textContent = "Appointment added successfully!";
                    msgDiv.style.display = 'block';
                    msgDiv.className = 'alert alert-success';
                    form.reset();
                    // Reload appointments list
                    loadAppointments();
                    // Hide form after successful submission
                    document.getElementById('appt-form-container').style.display = 'none';
                } else {
                    errorDiv.textContent = data.message || data.error || "Failed to add appointment.";
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = "An error occurred.";
                errorDiv.style.display = 'block';
            }
        });

        // Function to load appointments
        async function loadAppointments() {
            const container = document.getElementById('appointments-list');
            const noAppointments = document.getElementById('no-appointments');
            container.innerHTML = ''; // Clear current list
            noAppointments.style.display = 'none';

            try {
                // Replace with your actual endpoint to fetch appointments
                let response = await fetch('../process/appointment_process.php');
                let data = await response.json();

                if (data.success && data.appointments && data.appointments.length > 0) {
                    data.appointments.forEach(appt => {
                        // Format date and time for display
                        const apptDate = new Date(appt.appointment_date + 'T' + appt.appointment_time);
                        const formattedDate = apptDate.toLocaleDateString('en-US', {
                            weekday: 'long',
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric'
                        });
                        const formattedTime = apptDate.toLocaleTimeString('en-US', {
                            hour: '2-digit',
                            minute: '2-digit'
                        });

                        container.innerHTML += `
                            <div class="appointment-card">
                                <div class="appointment-header">
                                    <h3>${appt.appointment_type}</h3>
                                    <span>Dr. ${appt.doctor_name}</span>
                                </div>
                                <div class="appointment-body">
                                    <div class="appointment-date">
                                        <i class="fas fa-calendar-day"></i>
                                        <span>${formattedDate} at ${formattedTime}</span>
                                    </div>
                                    <div class="appointment-location">
                                        <i class="fas fa-map-marker-alt"></i>
                                        <span>${appt.location || 'No location specified'}</span>
                                    </div>
                                    ${appt.notes ? `<p class="mt-md"><i class="fas fa-sticky-note"></i> Notes: ${appt.notes}</p>` : ''}
                                </div>
                            </div>
                        `;
                    });
                } else {
                    noAppointments.style.display = 'block';
                }
            } catch (e) {
                console.error('Error loading appointments:', e);
                noAppointments.textContent = 'Error loading appointments.';
                noAppointments.style.display = 'block';
            }
        }

        // Call loadAppointments on page load
        document.addEventListener('DOMContentLoaded', loadAppointments);
    </script>
