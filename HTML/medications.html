    <script>
        // Update current year in footer
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Show/Hide Medication Form
        document.getElementById('add-med-btn').addEventListener('click', () => {
            document.getElementById('med-form-container').style.display = 'block';
        });
        document.getElementById('cancel-med-btn').addEventListener('click', () => {
            document.getElementById('med-form-container').style.display = 'none';
        });

        // Medication Form Submission
        document.getElementById('medication-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            // Validate end date if provided
            const endDateInput = document.getElementById('end_date');
            const formError = document.getElementById('form-error');
            formError.style.display = 'none';

            if (endDateInput.value) {
                const endDate = new Date(endDateInput.value);
                const today = new Date();
                today.setHours(0, 0, 0, 0); // Set to beginning of day for fair comparison

                if (endDate < today) {
                    formError.textContent = "End date cannot be in the past. Please select today or a future date.";
                    formError.style.display = 'block';
                    return;
                }
            }

            // Combine frequency fields into one value
            const freqNum = document.getElementById('frequency_number').value;
            const freqPeriod = document.getElementById('frequency_period').value;
            let freqInput = document.getElementById('frequency');
            if (!freqInput) {
                freqInput = document.createElement('input');
                freqInput.type = 'hidden';
                freqInput.name = 'frequency';
                freqInput.id = 'frequency';
                e.target.appendChild(freqInput);
            }
            freqInput.value = freqNum + ' ' + freqPeriod;

            const form = e.target;
            const formData = new FormData(form);
            const msgDiv = document.getElementById('med-success-msg');
            msgDiv.style.display = 'none';
            msgDiv.className = 'alert alert-success';

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data && data.success) {
                    msgDiv.textContent = "Medication added successfully!";
                    msgDiv.style.display = 'block';
                    msgDiv.className = 'alert alert-success';
                    form.reset();
                    if (typeof loadMedications === 'function') loadMedications(); // Assuming this function exists to refresh list
                } else {
                    formError.textContent = data.message || "Failed to add medication."; // Use error div
                    formError.style.display = 'block';
                    formError.className = 'alert alert-danger'; // Ensure correct class
                }
            } catch (err) {
                formError.textContent = "An error occurred while adding medication."; // Use error div
                formError.style.display = 'block';
                formError.className = 'alert alert-danger'; // Ensure correct class
            }
        });

        // Function to load medications
        async function loadMedications() {
            const container = document.getElementById('medications-list');
            const noMedications = document.getElementById('no-medications');
            container.innerHTML = ''; // Clear current list
            noMedications.style.display = 'none';

            try {
                // Replace with your actual endpoint to fetch medications
                let response = await fetch('../process/medications_process.php');
                let data = await response.json();

                if (data.success && data.medications && data.medications.length > 0) {
                    data.medications.forEach(med => {
                        container.innerHTML += `
                            <div class="medication-card">
                                <div class="medication-header">
                                    <h3>${med.med_name}</h3>
                                    <span>${med.dosage}</span>
                                </div>
                                <div class="medication-body">
                                    <p><i class="fas fa-sync-alt"></i> Frequency: ${med.frequency}</p>
                                    <p><i class="fas fa-calendar-alt"></i> Dates: ${med.start_date} to ${med.end_date || 'Ongoing'}</p>
                                    <div class="medication-time">
                                        <i class="fas fa-clock"></i> ${med.time_of_day}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    noMedications.style.display = 'block';
                }
            } catch (e) {
                noMedications.textContent = 'Error loading medications.';
                noMedications.style.display = 'block';
            }
        }

        // Call loadMedications on page load
        document.addEventListener('DOMContentLoaded', loadMedications);
    </script>
