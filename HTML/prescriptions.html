    <script>
        // Update current year in footer
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Toggle Prescription Form Visibility
        document.getElementById('add-prescription-btn').addEventListener('click', () => {
            document.getElementById('prescription-form-container').style.display = 'block';
        });
        document.getElementById('cancel-prescription-btn').addEventListener('click', () => {
            document.getElementById('prescription-form-container').style.display = 'none';
        });

        // Image preview functionality
        document.getElementById('prescription_image').addEventListener('change', function (e) {
            const preview = document.getElementById('image-preview');
            const previewImg = preview.querySelector('img');

            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImg.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(this.files[0]);
            } else {
                preview.style.display = 'none';
            }
        });

        // Load Prescriptions List
        async function loadPrescriptions() {
            const container = document.getElementById('prescriptions-list');
            const noPrescriptions = document.getElementById('no-prescriptions');
            container.innerHTML = ''; // Clear current list
            noPrescriptions.style.display = 'none';

            try {
                // Replace with your actual endpoint to fetch prescriptions
                let response = await fetch('../process/prescription_process.php');
                let data = await response.json();

                if (data.success && data.prescriptions && data.prescriptions.length > 0) {
                    data.prescriptions.forEach(prescription => {
                        // Format date for display
                        const prescDate = new Date(prescription.issue_date);
                        const formattedDate = prescDate.toLocaleDateString('en-US', {
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric'
                        });

                        container.innerHTML += `
                            <div class="prescription-card">
                                <div class="prescription-header">
                                    <h3>Dr. ${prescription.doctor_name}</h3>
                                    <span><i class="fas fa-user-md"></i></span>
                                </div>
                                <div class="prescription-body">
                                    <div class="prescription-date">
                                        <i class="fas fa-calendar-alt"></i> ${formattedDate}
                                    </div>
                                    <p>${prescription.notes || 'No additional notes'}</p>
                                    ${prescription.image_path ? `
                                        <div class="prescription-image">
                                            <img src="${prescription.image_path}" alt="Prescription Image" 
                                                onclick="window.open('${prescription.image_path}', '_blank')">
                                            <div class="mt-sm">
                                                <a href="${prescription.image_path}" class="btn btn-sm btn-outline" target="_blank">
                                                    <i class="fas fa-external-link-alt"></i> View Full Image
                                                </a>
                                            </div>
                                        </div>
                                    ` : '<p class="muted-text"><i class="fas fa-info-circle"></i> No image attached</p>'}
                                </div>
                            </div>
                        `;
                    });
                } else {
                    noPrescriptions.style.display = 'block';
                }
            } catch (e) {
                console.error('Error loading prescriptions:', e);
                noPrescriptions.textContent = 'Error loading prescriptions.';
                noPrescriptions.style.display = 'block';
            }
        }

        // Call loadPrescriptions on page load
        document.addEventListener('DOMContentLoaded', loadPrescriptions);

        // Prescription Form Submission
        document.getElementById('prescription-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const msgDiv = document.getElementById('prescription-success-msg');
            const errorDiv = document.getElementById('prescription-form-error');
            msgDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data && data.success) {
                    msgDiv.textContent = "Prescription added successfully!";
                    msgDiv.style.display = 'block';
                    msgDiv.className = 'alert alert-success';
                    form.reset();
                    document.getElementById('image-preview').style.display = 'none';
                    loadPrescriptions(); // Reload list
                    // Hide form after successful submission
                    setTimeout(() => {
                        document.getElementById('prescription-form-container').style.display = 'none';
                    }, 1500);
                } else {
                    errorDiv.textContent = data.message || "Failed to add prescription.";
                    errorDiv.style.display = 'block';
                    errorDiv.className = 'alert alert-danger';
                }
            } catch (err) {
                errorDiv.textContent = "An error occurred while adding prescription.";
                errorDiv.style.display = 'block';
                errorDiv.className = 'alert alert-danger';
            }
        });
    </script>
